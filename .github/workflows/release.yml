name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (for example, v0.2.1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate version and model
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "requested tag ${TAG} does not match Cargo version ${version}" >&2
            exit 1
          fi
          if existing=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            if [[ "${existing}" != "${GITHUB_SHA}" ]]; then
              echo "tag ${TAG} already points to ${existing}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi
          scripts/check-model.sh
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify embedded model
        run: scripts/check-model.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package release archive
        run: |
          scripts/package-release.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/da" \
            tmp/dist

      - name: Smoke-test extracted archive
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/da-smoke-${TARGET}"
          mkdir -p "${smoke_root}"
          tar -C "${smoke_root}" -xzf "tmp/dist/da-${TARGET}.tar.gz"
          scripts/smoke-release.sh \
            "${smoke_root}/da-${TARGET}/bin/da" \
            "${TARGET}" \
            "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            tmp/dist/da-${{ matrix.target }}.tar.gz
            tmp/dist/da-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify complete artifact set
        run: |
          set -euo pipefail
          for target in \
            aarch64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            test -f "dist/da-${target}.tar.gz"
            test -f "dist/da-${target}.tar.gz.sha256"
            (cd dist && shasum -a 256 -c "da-${target}.tar.gz.sha256")
          done

      - name: Create tag after successful builds
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if existing=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            test "${existing}" = "${GITHUB_SHA}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true

  update-tap:
    needs: [validate, publish]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-aarch64-apple-darwin
          path: dist

      - name: Read Apple ARM64 checksum
        id: checksum
        run: |
          sha256=$(awk '{ print $1 }' dist/da-aarch64-apple-darwin.tar.gz.sha256)
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: amenocturne/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}

      - name: Update Formula/da.rb
        env:
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://github.com/amenocturne/da/releases/download/${TAG}/da-aarch64-apple-darwin.tar.gz"
          sed -i "s|^  url \".*\"|  url \"${url}\"|" Formula/da.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"${SHA256}\"|" Formula/da.rb
          sed -i "s|^  version \".*\"|  version \"${version}\"|" Formula/da.rb

      - name: Commit and push tap update
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Formula/da.rb; then
            exit 0
          fi
          git commit -am "Bump da to ${TAG}"
          git push
